services:
  - type: web
    name: juvelle-spark-mcp-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: QDRANT_URL
        value: https://3c502767-14fe-4ed6-81ef-613b5965d897.us-east-1-1.aws.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: juvelle_knowledge
      - key: META_VERIFY_TOKEN
        value: gemini_spark_secret_verify_token
      - key: META_PAGE_ID
        value: "932916046574692"
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
